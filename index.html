<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Model 3 Hits · a ride down memory lane</title>
<meta name="description" content="Tamil hits from the back seat of a Model 3. A remake of Town Bus Hits.">
<style>
  :root{ --ink:#e8edf2; --dim:#9aa4ad; --chip:rgba(10,12,15,.7); --blue:#4f8fea; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;color:var(--ink)}

  /* ---------- photo stage: day + night scenes crossfade ---------- */
  #stage{position:fixed;inset:0;overflow:hidden;background:#000}
  .scene{position:absolute;inset:0;transition:opacity 1.6s ease}
  #sceneNight{opacity:0}
  .night #sceneNight{opacity:1}
  .rig{position:absolute;will-change:transform}
  .photo{position:absolute;inset:0;width:100%;height:100%;display:block}
  .fx{position:absolute;pointer-events:none}
  .glow{border-radius:50%;mix-blend-mode:screen}

  /* day */
  .cloud{border-radius:50%;filter:blur(28px);background:radial-gradient(closest-side,rgba(255,255,255,.5),rgba(255,255,255,0));
    mix-blend-mode:screen;opacity:.16}
  #cloudA{width:46%;height:14%;left:-20%;top:6%;animation:driftA 64s linear infinite}
  #cloudB{width:34%;height:11%;left:-15%;top:17%;animation:driftB 89s linear infinite}
  @keyframes driftA{from{transform:translateX(0)}to{transform:translateX(320%)}}
  @keyframes driftB{from{transform:translateX(0)}to{transform:translateX(420%)}}
  #glare{width:26%;height:16%;left:47%;top:35%;filter:blur(20px);
    background:radial-gradient(closest-side,rgba(255,240,200,.55),rgba(255,240,200,0));animation:glow 7s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.6;transform:scale(1.12)}}
  #sweepDay{inset:0;overflow:hidden}
  #sweepDay b{position:absolute;top:-20%;left:-35%;width:22%;height:140%;transform:skewX(-18deg);
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,252,240,.10),rgba(255,255,255,0));
    animation:sweep 9.5s ease-in-out infinite}
  @keyframes sweep{0%,55%{left:-35%}85%,100%{left:120%}}

  /* night */
  #street{width:9%;height:6.8%;left:27.3%;top:5.4%;filter:blur(8px);
    background:radial-gradient(closest-side,rgba(225,255,190,.75),rgba(225,255,190,0));animation:flicker 5.3s steps(1,end) infinite}
  @keyframes flicker{0%,100%{opacity:.75}12%{opacity:.55}14%{opacity:.8}61%{opacity:.62}63%{opacity:.85}}
  .dome{width:5.5%;height:4.1%;filter:blur(6px);
    background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0));animation:breathe 4.6s ease-in-out infinite}
  #domeL{left:39.4%;top:29.6%}
  #domeR{left:53.5%;top:30%;animation-delay:-2.3s}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:.8}}
  #redDot{width:1.6%;height:1.2%;left:48.3%;top:31.2%;filter:blur(2px);
    background:radial-gradient(closest-side,rgba(255,60,60,.95),rgba(255,60,60,0));animation:blink 2.2s ease-in-out infinite}
  .led{width:2.2%;height:1.7%;top:33.55%;filter:blur(2px);
    background:radial-gradient(closest-side,rgba(205,90,255,.95),rgba(205,90,255,0));animation:blink 3.4s ease-in-out infinite}
  #ledA{left:45.2%} #ledB{left:47.7%;animation-delay:-.15s}
  @keyframes blink{0%,100%{opacity:.25}45%,55%{opacity:1}}
  #city{left:0;top:2%;width:16%;height:15%}
  #city i{position:absolute;width:3px;height:2px;background:#ffe9b0;border-radius:1px;box-shadow:0 0 4px #ffd27a;
    mix-blend-mode:screen;animation:tw 3.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.08}50%{opacity:.7}}
  .scr{border-radius:14px;filter:blur(12px);
    background:radial-gradient(closest-side,rgba(170,200,255,.38),rgba(170,200,255,0));animation:scr 6s ease-in-out infinite}
  #scrMain{left:31%;top:48.5%;width:28.5%;height:16.5%}
  #scrRear{left:48%;top:91.5%;width:31%;height:9%;animation-delay:-3s}
  @keyframes scr{0%,100%{opacity:.55}50%{opacity:.9}}
  .playing .scr{animation-duration:1.09s}
  #wind{left:37%;top:33.5%;width:39%;height:13.5%;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent)}
  #wind b{position:absolute;top:-10%;left:-45%;width:30%;height:120%;transform:skewX(-20deg);filter:blur(6px);mix-blend-mode:screen;
    background:linear-gradient(90deg,rgba(255,210,140,0),rgba(255,214,150,.38),rgba(255,210,140,0));animation:pass 8.5s ease-in-out infinite}
  #wind b+b{animation-delay:-4.1s;animation-duration:11s;background:linear-gradient(90deg,rgba(180,210,255,0),rgba(190,215,255,.26),rgba(180,210,255,0))}
  @keyframes pass{0%,62%{left:-45%}82%,100%{left:125%}}

  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
  /* now-playing strip mapped onto each photo's Tesla screen */
  .strip{position:absolute;left:0;top:0;width:300px;height:44px;transform-origin:0 0;
    background:#0b0c10f2;border-radius:3px;overflow:hidden;display:flex;align-items:center;gap:8px;padding:0 10px}
  .strip .pp{width:0;height:0;border-style:solid;flex:none}
  .strip .pp.play{border-width:7px 0 7px 11px;border-color:transparent transparent transparent #4f8fea}
  .strip .pp.pause{border:none;width:10px;height:14px;border-left:4px solid #4f8fea;border-right:4px solid #4f8fea}
  .strip .tt{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
  .strip .bar{position:absolute;left:10px;right:10px;bottom:5px;height:3px;background:#22262d;border-radius:2px}
  .strip .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#4f8fea;border-radius:2px}
  @media (prefers-reduced-motion: reduce){ .fx, .fx *{animation:none !important} }

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none}
  #title{position:absolute;top:calc(12px + env(safe-area-inset-top));left:16px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  #title b{font-size:13px;letter-spacing:.24em;font-weight:700;text-transform:uppercase}
  #title span{display:block;font-size:10px;letter-spacing:.14em;color:var(--dim);margin-top:3px}
  #credit{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    font-size:9px;letter-spacing:.08em;color:rgba(200,208,216,.8);pointer-events:auto;text-decoration:none;white-space:nowrap;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  #chip{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
    width:min(560px, calc(100% - 24px));
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 14px;border-radius:16px;
    background:var(--chip);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.07);pointer-events:auto}
  .ibtn{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--ink);
    width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  .ibtn:active{background:rgba(255,255,255,.1)}
  .ibtn svg{width:14px;height:14px;fill:var(--ink)}
  #song{flex:1;min-width:0}
  #songTa{font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #songEn{font-size:10px;letter-spacing:.1em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  #seekRow{display:flex;align-items:center;gap:8px;width:100%}
  #tCur,#tDur{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none;min-width:30px}
  #tDur{text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);margin-top:-5px}
  #seek{flex:1;accent-color:var(--blue)}
  #miscRow{display:flex;align-items:center;gap:10px;width:100%}
  #status{flex:1;font-size:10px;letter-spacing:.08em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--ink);
    font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:6px 10px;border-radius:8px;cursor:pointer;flex:none}
  .pill:active{background:rgba(255,255,255,.1)}
  a.pill{text-decoration:none;display:inline-flex;align-items:center;line-height:1.2}

  /* boarding */
  #board{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 30%, rgba(13,20,28,.55) 0%, rgba(5,8,12,.88) 75%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    cursor:pointer;z-index:10;text-align:center;padding:24px}
  #board h1{font-size:30px;font-weight:700;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  #board .sub{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#c8d0d8}
  #board .tap{margin-top:22px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    border:1px solid rgba(255,255,255,.35);padding:12px 26px;border-radius:999px;animation:pulse 2.2s ease-in-out infinite}
  #board .foot{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));font-size:10px;letter-spacing:.06em;color:rgba(200,208,216,.85);line-height:1.7}
  #board .foot a{color:#e2e8ee}
  @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
  @media (max-width:430px){ #board h1{font-size:24px} }
  #ytWrap{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
</style>
</head>

      <div id="songTa">பாட்டு ஏறுது…</div>
      <div id="songEn">boarding</div>
    </div>
    <div id="seekRow">
      <span id="tCur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="tDur">0:00</span>
    </div>
    <div id="miscRow">
      <span id="status">songs play via YouTube</span>
      <a id="plLink" class="pill" href="#" target="_blank" rel="noopener" style="display:none">Playlist ↗</a>
      <button class="pill" id="nightBtn">Night</button>
    </div>
  </div>
</div>

<div id="board">
  <h1>பாட்டு ஏறுது…</h1>
  <div class="sub">Model 3 Hits</div>
  <div class="tap">tap to board</div>
  <div class="foot">Tamil hits from the back seat of a Model 3<br>
    a remake of <a href="https://town-bus.vercel.app" target="_blank" rel="noopener">Town Bus Hits</a> · songs play via YouTube</div>
</div>

<script>
(function(){
"use strict";

/* ================= CONFIG =================
   PLAYLIST_URL — the ONE playlist every visitor hears. You (the owner)
   set it here; visitors get no choice. Paste any PUBLIC or UNLISTED
   YouTube playlist link, e.g.
     https://www.youtube.com/playlist?list=PLxxxxxxxx
   A bare id (PL…/UU…/OLAK5uy_…) or a single video link also works.
   Leave '' to use the built-in Tamil MIX below.
   Note: Mixes (list=RD…) and Watch Later can't be embedded.

   GOOGLE_API_KEY — optional but recommended. With it, the playlist is
   fetched through the YouTube Data API and played song-by-song: real
   titles in the UI, private/deleted tracks skipped, most reliable path.
     console.cloud.google.com → APIs & Services → Credentials →
     + Create Credentials → API key. Then Edit key → restrict to
     YouTube Data API v3 + your site (https://haresh-16.github.io/*).
   Without it, the playlist plays via YouTube's own embed player.
============================================= */
var CONFIG = {
  PLAYLIST_URL: 'https://music.youtube.com/playlist?list=PLUg6vO2_neOQFgj1nqFxYGBuwKAm3de1s&si=eWPaLrOgtxZnmOUJ',
  GOOGLE_API_KEY: ''
};

var MIX = [
  {id:'SZOt9Xf8kOg', ta:'வாத்தி கமிங்',   en:'Vaathi Coming · Master'},
  {id:'KUN5Uf9mObQ', ta:'அரபிக் குத்து',   en:'Arabic Kuthu · Beast'},
  {id:'2ogKpj5QuSY', ta:'ஆளுமா டோளுமா',  en:'Aaluma Doluma · Vedalam'},
  {id:'i1BqRYMFS08', ta:'அப்படி போடு',     en:'Appadi Podu · Ghilli'},
  {id:'YR12Z8f1Dh8', ta:'கொலவெறி டி',     en:'Why This Kolaveri Di · 3'}
];

/* ---------- photo geometry (fractions of each image) ----------
   strip = the 4 corners (tl,tr,br,bl) where the now-playing card is
   drawn onto that photo's Tesla screen. */
var GEO = {
  day:   { strip:[[0.4559,0.5921],[0.5532,0.5888],[0.5520,0.6065],[0.4560,0.6100]] },
  night: { strip:[[0.4540,0.6030],[0.5640,0.6020],[0.5650,0.6220],[0.4550,0.6240]] }
};

function $(id){ return document.getElementById(id); }
function fmt(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+':' + ('0'+(s%60)).slice(-2); }

/* ================= STAGE: cover-fit + liveliness ================= */
var IMG_W=1536, IMG_H=2040;            // both photos share this size
var stage=$('stage');
var scenes=[
  {rig:document.querySelector('#sceneDay .rig'),   strip:document.querySelector('#sceneDay .strip'),   geo:GEO.day},
  {rig:document.querySelector('#sceneNight .rig'), strip:document.querySelector('#sceneNight .strip'), geo:GEO.night}
];
var rigW=0, rigH=0;
function layout(){
  var vw=window.innerWidth, vh=window.innerHeight;
  var sc=Math.max(vw/IMG_W, vh/IMG_H);
  rigW=IMG_W*sc; rigH=IMG_H*sc;
  scenes.forEach(function(s){
    s.rig.style.width=rigW+'px'; s.rig.style.height=rigH+'px';
    s.rig.style.left=((vw-rigW)/2)+'px'; s.rig.style.top=((vh-rigH)/2)+'px';
    placeStrip(s);
  });
}
/* twinkling city windows (night) */
(function(){
  var host=$('city'), html='';
  for (var i=0;i<26;i++){
    html += '<i style="left:'+(4+Math.random()*90)+'%;top:'+(4+Math.random()*80)+'%;animation-delay:'+(-Math.random()*3.6)+'s;animation-duration:'+(2.4+Math.random()*3)+'s"></i>';
  }
  host.innerHTML=html;
})();

/* homography: map a strip div onto a Tesla screen in the photo */
function adj(m){ return [
  m[4]*m[8]-m[5]*m[7], m[2]*m[7]-m[1]*m[8], m[1]*m[5]-m[2]*m[4],
  m[5]*m[6]-m[3]*m[8], m[0]*m[8]-m[2]*m[6], m[2]*m[3]-m[0]*m[5],
  m[3]*m[7]-m[4]*m[6], m[1]*m[6]-m[0]*m[7], m[0]*m[4]-m[1]*m[3] ]; }
function mulMM(a,b){ var c=[],i,j,k; for(i=0;i<3;i++)for(j=0;j<3;j++){var s=0;for(k=0;k<3;k++)s+=a[3*i+k]*b[3*k+j];c[3*i+j]=s;} return c; }
function mulMV(m,v){ return [ m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2] ]; }
function basis(p1,p2,p3,p4){
  var m=[p1[0],p2[0],p3[0], p1[1],p2[1],p3[1], 1,1,1];
  var v=mulMV(adj(m),[p4[0],p4[1],1]);
  return mulMM(m,[v[0],0,0, 0,v[1],0, 0,0,v[2]]);
}
function proj2d(s1,s2,s3,s4, d1,d2,d3,d4){
  return mulMM(basis(d1,d2,d3,d4), adj(basis(s1,s2,s3,s4)));
}
function placeStrip(s){
  var q=s.geo.strip;
  function P(p){ return [p[0]*rigW, p[1]*rigH]; }
  var TL=P(q[0]), TR=P(q[1]), BR=P(q[2]), BL=P(q[3]);
  var W=300, H=44;
  var h=proj2d([0,0],[W,0],[0,H],[W,H], TL,TR,BL,BR);
  for (var i=0;i<9;i++) h[i]=h[i]/h[8];
  var m=[h[0],h[3],0,h[6], h[1],h[4],0,h[7], 0,0,1,0, h[2],h[5],0,h[8]];
  s.strip.style.transform='matrix3d('+m.join(',')+')';
}

var playingGlobal=false, t0=performance.now();
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function sway(){
  var t=(performance.now()-t0)/1000, a=RM?0.25:1;
  var zoom=1.055 + Math.sin(t*0.11)*0.012*a + (playingGlobal? Math.sin(t*2*Math.PI*0.92)*0.0035*a : 0);
  var sx=(Math.sin(t*0.5)*5 + Math.sin(t*1.7)*1.5)*a;
  var sy=(Math.sin(t*0.9)*3 + Math.sin(t*7.3)*0.8)*a;
  var rot=Math.sin(t*0.23)*0.25*a;
  var tf='scale('+zoom.toFixed(4)+') translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) rotate('+rot.toFixed(2)+'deg)';
  scenes[0].rig.style.transform=tf; scenes[1].rig.style.transform=tf;
  requestAnimationFrame(sway);
}
window.addEventListener('resize', layout);
layout(); requestAnimationFrame(sway);

var night=false, nightBtn=$('nightBtn');
function setNight(on){
  night=on; document.body.classList.toggle('night', on);
  stage.classList.toggle('night', on);
  nightBtn.textContent = on ? 'Day' : 'Night';
}
nightBtn.addEventListener('click', function(){ setNight(!night); });
(function(){ var h=new Date().getHours(); if (h>=19||h<6) setNight(true); })();

/* ================= PLAYER UI ================= */
var songTa=$('songTa'), songEn=$('songEn'), statusEl=$('status');
var tCur=$('tCur'), tDur=$('tDur'), seek=$('seek');
var icoPlay=$('icoPlay'), icoPause=$('icoPause');
var stripTTs=document.querySelectorAll('.strip .tt'), stripBars=document.querySelectorAll('.strip .bar i'), stripPPs=document.querySelectorAll('.strip .pp');
function each(list, fn){ for (var i=0;i<list.length;i++) fn(list[i]); }
var now={title:'—', sub:'', ct:0, dur:0, playing:false};
var seeking=false;

function paintNow(){
  songTa.textContent = now.title || '—';
  songEn.textContent = now.sub || '';
  icoPlay.style.display = now.playing?'none':'block';
  icoPause.style.display = now.playing?'block':'none';
  each(stripTTs, function(el){ el.textContent = now.title || 'Model 3 Hits'; });
  each(stripPPs, function(el){ el.className = 'pp ' + (now.playing?'pause':'play'); });
  playingGlobal = now.playing;
  stage.classList.toggle('playing', now.playing);
}
function paintTime(){
  tCur.textContent=fmt(now.ct); tDur.textContent=fmt(now.dur);
  var p = now.dur>0 ? now.ct/now.dur : 0;
  if (!seeking) seek.value = Math.round(p*1000);
  each(stripBars, function(el){ el.style.width = (p*100)+'%'; });
}
function setStatus(t){ statusEl.textContent=t; }
var plLink=$('plLink');
function updatePlLink(){
  var href='', label='';
  if (SRC.list){ href='https://www.youtube.com/playlist?list='+encodeURIComponent(SRC.list); label='Playlist ↗'; }
  else if (SRC.video){ href='https://www.youtube.com/watch?v='+SRC.video; label='Song ↗'; }
  else if (queue[qi]){ href='https://www.youtube.com/watch?v='+queue[qi].id; label='Song ↗'; }
  if (href){ plLink.href=href; plLink.textContent=label; plLink.style.display=''; }
  else plLink.style.display='none';
}

/* ================= THE PLAYLIST (owner-configured) ================= */
function parseSource(v){
  v = String(v||'').trim();
  if (!v) return {mix:true};
  var mList = v.match(/[?&]list=([\w-]+)/) || v.match(/^((?:PL|UU|FL|OLAK5uy_)[\w-]{8,})$/);
  if (mList){
    var id = mList[1];
    if (/^(RD|WL$|LL$)/.test(id)) return {bad:'Mixes / Watch Later can\'t be embedded', mix:true};
    return {list:id};
  }
  var mVid = v.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/) || (/^[\w-]{11}$/.test(v)?[0,v]:null);
  if (mVid) return {video:mVid[1]};
  return {bad:'PLAYLIST_URL not recognized', mix:true};
}
var SRC = parseSource(CONFIG.PLAYLIST_URL);

/* ================= YOUTUBE ENGINE ================= */
var ytP=null, ytReady=false, boarded=false, pendingPlay=false, errStreak=0;
var ytMode = SRC.list ? 'list' : 'queue';   // may flip to 'queue' if API fetch succeeds
var queue = SRC.video ? [{id:SRC.video, ta:'', en:'the song', sub:'Model 3 Hits'}] : MIX.slice();
var qi=0;

var tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
tag.onerror=function(){ setStatus('YouTube blocked here — open the deployed page for music'); };
document.head.appendChild(tag);

var listWatchdog=null;
function onYTReady(){
  ytReady=true;
  if (boarded){ try{ ytP.playVideo(); }catch(e){} }
  else setStatus(ytMode==='list' ? 'playlist cued · tap to board' : 'ready · '+queue.length+' songs on board');
}
function onYTState(e){
  if (e.data===YT.PlayerState.PLAYING){
    errStreak=0; clearTimeout(listWatchdog); now.playing=true; now.dur=ytP.getDuration()||0;
    if (ytMode==='list'){ try{ ytP.setLoop(true); var d=ytP.getVideoData(); now.title=d&&d.title?d.title:'YouTube'; now.sub='Model 3 Hits playlist'; }catch(x){} }
    setStatus('now playing'); paintNow();
  } else if (e.data===YT.PlayerState.CUED){ if (ytMode==='list' && boarded) try{ ytP.playVideo(); }catch(x){} }
  else if (e.data===YT.PlayerState.PAUSED){ now.playing=false; setStatus('paused'); paintNow(); }
  else if (e.data===YT.PlayerState.BUFFERING){ setStatus('பாட்டு ஏறுது…'); }
  else if (e.data===YT.PlayerState.ENDED){ ytNext(); }
}
function onYTError(){
  errStreak++;
  if (ytMode==='list'){
    if (errStreak>=3){ setStatus("the playlist won't embed — owner: check it's Public/Unlisted"); now.playing=false; paintNow(); return; }
    setStatus('song skipped…'); try{ ytP.nextVideo(); }catch(x){} return;
  }
  if (errStreak>=Math.max(queue.length,3)){ setStatus('songs are unavailable right now'); now.playing=false; paintNow(); return; }
  setStatus('song skipped…'); ytNext();
}
function buildYT(videoId){
  ytReady=false;
  try{ if (ytP && ytP.destroy) ytP.destroy(); }catch(e){}
  var w=$('ytWrap'); w.innerHTML='<div id="yt"></div>';
  ytP=new YT.Player('yt',{ height:'2', width:'2', videoId:videoId,
    playerVars:{playsinline:1,controls:0,disablekb:1,rel:0},
    events:{onReady:onYTReady, onStateChange:onYTState, onError:onYTError} });
}
/* playlists load via the battle-tested /embed/videoseries?list= iframe
   (the markup YouTube's own Share→Embed generates), API attached to it */
function buildYTList(listId){
  ytReady=false;
  try{ if (ytP && ytP.destroy) ytP.destroy(); }catch(e){}
  var w=$('ytWrap');
  var url='https://www.youtube.com/embed/videoseries?list='+encodeURIComponent(listId)
    +'&enablejsapi=1&playsinline=1&controls=0&rel=0'
    +'&origin='+encodeURIComponent(location.origin);
  w.innerHTML='<iframe id="yt" width="2" height="2" frameborder="0" '
    +'allow="autoplay; encrypted-media" src="'+url+'"></iframe>';
  ytP=new YT.Player('yt', {events:{onReady:onYTReady, onStateChange:onYTState, onError:onYTError}});
}
function ytTitlesFromQueue(){
  var s=queue[qi]||{};
  now.title = s.ta || s.en || 'YouTube';
  now.sub = s.ta ? s.en : (s.sub||'Model 3 Hits');
}
function ytLoad(i){
  qi=(i+queue.length)%queue.length;
  ytTitlesFromQueue(); now.ct=0; now.dur=0; paintNow(); paintTime(); updatePlLink();
  if (ytReady) ytP.loadVideoById(queue[qi].id);
}
function ytNext(){
  if (ytMode==='list'){ if(ytReady) try{ ytP.nextVideo(); }catch(e){} return; }
  ytLoad(qi+1);
}

/* If the owner supplied a playlist AND an API key, prefetch the songs
   and play them one-by-one (most reliable, real titles). Falls back to
   the videoseries embed if the fetch fails. */
var apiQueueReady=false;
function prefetchViaAPI(listId){
  var items=[];
  function page(tok){
    var u='https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId='
      + encodeURIComponent(listId) + '&key=' + encodeURIComponent(CONFIG.GOOGLE_API_KEY)
      + (tok ? ('&pageToken='+tok) : '');
    return fetch(u).then(function(r){return r.json();}).then(function(j){
      if (j.error) throw j.error;
      (j.items||[]).forEach(function(it){
        var sn=it.snippet||{}, vid=sn.resourceId && sn.resourceId.videoId;
        if (vid && sn.title!=='Private video' && sn.title!=='Deleted video')
          items.push({id:vid, ta:'', en:sn.title||'YouTube', sub:'Model 3 Hits playlist'});
      });
      if (j.nextPageToken && items.length<200) return page(j.nextPageToken);
    });
  }
  return page('').then(function(){ return items; });
}

function startEngine(){
  if (SRC.list && CONFIG.GOOGLE_API_KEY){
    prefetchViaAPI(SRC.list).then(function(items){
      if (!items.length) throw 'empty';
      if (now.playing){ apiQueueReady=true; return; } // already rolling via embed — don't interrupt
      ytMode='queue'; queue=items; qi=0; apiQueueReady=true;
      ytTitlesFromQueue(); paintNow();
      if (window.YT && YT.Player) buildYT(queue[0].id); // rebuild cued on the real first song
    }).catch(function(){
      ytMode='list';
      if (window.YT && YT.Player) buildYTList(SRC.list);
    });
    // while fetching, cue the videoseries embed so something exists
    buildYTList(SRC.list);
  }
  else if (SRC.list){ buildYTList(SRC.list); }
  else { buildYT(queue[0].id); }
  if (SRC.bad) setStatus(SRC.bad + ' — playing the Tamil mix');
}
window.onYouTubeIframeAPIReady=function(){ startEngine(); };

/* ================= CONTROLS ================= */
$('playBtn').addEventListener('click', function(){
  if (!ytReady){ setStatus('still boarding…'); return; }
  if (now.playing) ytP.pauseVideo(); else ytP.playVideo();
});
$('nextBtn').addEventListener('click', function(){ if(ytReady) ytNext(); });
seek.addEventListener('input', function(){ seeking=true; });
seek.addEventListener('change', function(){
  var p=+seek.value/1000;
  if (ytReady && now.dur>0) ytP.seekTo(now.dur*p, true);
  seeking=false;
});

setInterval(function(){
  if (ytReady && ytP && ytP.getCurrentTime){
    now.ct=ytP.getCurrentTime()||0;
    if (!now.dur) now.dur=ytP.getDuration()||0;
    paintTime();
  }
}, 500);

/* ================= BOARDING ================= */
var board=$('board');
board.addEventListener('click', function(){
  if (boarded) return; boarded=true;
  board.style.transition='opacity .7s'; board.style.opacity=0;
  setTimeout(function(){ board.style.display='none'; },750);
  if (ytMode==='queue') { ytTitlesFromQueue(); }
  else { now.title='உங்க playlist'; now.sub='Model 3 Hits'; }
  paintNow();
  if (ytReady){ try{ ytP.playVideo(); }catch(e){} }
  else { pendingPlay=true; setStatus('பாட்டு ஏறுது…'); }
  clearTimeout(listWatchdog);
  listWatchdog=setTimeout(function(){
    if (!now.playing && errStreak===0) setStatus("didn't start? tap ▶ — or owner: check the playlist is Public");
  }, 6000);
  setTimeout(function(){ if(!window.YT) setStatus('YouTube blocked here — open the deployed page for music'); },6000);
});

paintNow(); paintTime(); updatePlLink();
})();
</script>
</body>
</html>
